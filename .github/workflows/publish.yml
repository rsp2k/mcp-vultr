name: Publish to PyPI

# Publishes when a version tag is pushed (v2026.09.12 for pyproject version
# 2026.09.12) or on manual dispatch. Authentication: if the PYPI_API_TOKEN
# repository secret exists it is used; otherwise the publish action falls
# back to PyPI trusted publishing, which must then be configured on PyPI for
# this repository, this workflow file, and the "pypi" environment.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: false
        type: boolean
      skip_existing:
        description: 'Skip if version already exists'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.12"

jobs:
  # The release gate: hard lint errors plus the test files that cover the
  # MCP contract and are known green. The wider suite carries pre-existing
  # failures in the error-scenario, retry and cache files; those are tracked
  # separately and must not block a publish. The list lives in the Makefile.
  validate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --extra test

    - name: Lint for hard errors (undefined names, syntax)
      run: uv run ruff check --select F821,F822,F823,E9 src tests

    - name: Run release gate tests
      run: make test-release-gate

  # Build the wheel and sdist, then prove the wheel actually starts as an MCP
  # server: install it into a clean venv and speak JSON-RPC to it over stdio.
  # That probe is the failure mode consumers hit in 2.4.1 (import-time crash
  # on an unpinned FastMCP), which no unit test caught.
  build:
    name: Build and probe
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Extract version and check it against the tag
      id: version
      run: |
        VERSION=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Detected version: $VERSION"

        # PEP 440 pre-release markers. CalVer post-releases (2026.09.12.1) are not pre-releases.
        if echo "$VERSION" | grep -qE '[0-9](a|b|rc)[0-9]+$|\.dev[0-9]+$'; then
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
        fi

        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi
        fi

    - name: Build package
      run: |
        rm -rf dist
        uv build
        ls -la dist/

    - name: Check package metadata
      run: uvx twine check dist/*

    - name: Probe the built wheel over stdio
      run: |
        uv venv --python "$PYTHON_VERSION" .probe-venv
        uv pip install --python .probe-venv/bin/python dist/*.whl
        .probe-venv/bin/python -c "import fastmcp; print('resolved fastmcp', fastmcp.__version__)"
        uv run --no-project python scripts/stdio_probe.py .probe-venv/bin/mcp-vultr

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ steps.version.outputs.version }}
        path: dist/
        retention-days: 30

  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.test_pypi == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-vultr
    permissions:
      id-token: write  # trusted publishing fallback
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ needs.build.outputs.version }}
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: ${{ github.event.inputs.skip_existing == 'true' }}
        print-hash: true

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi != 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-vultr
    permissions:
      id-token: write  # trusted publishing fallback
      contents: write  # GitHub release
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ needs.build.outputs.version }}
        path: dist/

    # Tag pushes skip an already-published version instead of failing, so a
    # release published from a workstation first can still get its tag,
    # GitHub release and install test from here.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: ${{ github.event_name == 'push' || github.event.inputs.skip_existing == 'true' }}
        print-hash: true

    - name: Extract changelog entry
      id: changelog
      run: |
        VERSION="${{ needs.build.outputs.version }}"
        # Literal match on "## [VERSION]" so the dots in a CalVer version are not regex wildcards.
        awk -v v="$VERSION" '
          index($0, "## [" v "]") == 1 { found = 1; next }
          /^## / { found = 0 }
          found { print }
        ' CHANGELOG.md > current_changelog.md
        if [[ -s current_changelog.md ]]; then
          echo "changelog_file=current_changelog.md" >> "$GITHUB_OUTPUT"
        else
          echo "No changelog entry found for version $VERSION; release notes will be generated"
          echo "changelog_file=" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      with:
        name: mcp-vultr ${{ needs.build.outputs.version }}
        tag_name: ${{ github.ref_name }}
        body_path: ${{ steps.changelog.outputs.changelog_file }}
        files: dist/*
        prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
        generate_release_notes: ${{ steps.changelog.outputs.changelog_file == '' }}

  # Install what PyPI now serves and speak MCP to it, on every supported Python.
  test-published:
    name: Install from PyPI
    runs-on: ubuntu-latest
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install from PyPI (waits for the index to catch up)
      run: |
        VERSION="${{ needs.build.outputs.version }}"
        uv venv --python "${{ matrix.python-version }}" .pypi-venv
        for attempt in $(seq 1 10); do
          if uv pip install --python .pypi-venv/bin/python --no-cache "mcp-vultr==$VERSION"; then
            exit 0
          fi
          echo "Not on the index yet (attempt $attempt/10), retrying in 30s"
          sleep 30
        done
        echo "::error::mcp-vultr==$VERSION never became installable"
        exit 1

    - name: Smoke test the installed package
      run: |
        .pypi-venv/bin/vultr-cli --version
        .pypi-venv/bin/python -c "import mcp_vultr; print('mcp-vultr', mcp_vultr.__version__)"
        uv run --no-project python scripts/stdio_probe.py .pypi-venv/bin/mcp-vultr

  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build, publish, test-published]
    if: always()
    steps:
    - name: Publish summary
      run: |
        {
          echo "## PyPI publication summary"
          echo ""
          echo "**Version:** ${{ needs.build.outputs.version }}"
          echo "**Pre-release:** ${{ needs.build.outputs.is_prerelease }}"
          echo "**Project:** https://pypi.org/project/mcp-vultr/"
          echo ""
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            echo "- Publish: success"
          else
            echo "- Publish: ${{ needs.publish.result }}"
          fi
          if [[ "${{ needs.test-published.result }}" == "success" ]]; then
            echo "- Install test: success"
          else
            echo "- Install test: ${{ needs.test-published.result }}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
